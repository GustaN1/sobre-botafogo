<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notícia | Sobre Botafogo</title>
  <link rel="icon" type="image/png" href="img/favicon.png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header>
    <div class="nav-container">
      <div class="logo">
        <a href="index.html">
          Sobre Botafogo
        </a>
      </div>
      <nav>
        <ul>
          <li><a href="index.html">Notícias</a></li>
          <li><a href="historia.html">Nossa História</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main class="container" style="max-width: 800px;">
    <article id="article-detail">
      <p>Carregando matéria...</p>
    </article>
  </main>

  <footer>
    <p>&copy; 2026 Sobre Botafogo — Portal independente de notícias.</p>
  </footer>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const urlParams = new URLSearchParams(window.location.search);
      const articleId = parseInt(urlParams.get('id'));
      const articleDetail = document.getElementById('article-detail');

      fetch('data/noticias.json')
        .then(response => response.json())
        .then(noticias => {
          const noticia = noticias.find(n => n.id === articleId);

          if (noticia) {
            document.title = `${noticia.titulo} | Sobre Botafogo`;

            articleDetail.innerHTML = `
              <span class="card-tag">${noticia.categoria || 'Notícias'}</span>
              <h1 style="font-size: 2.2rem; margin: 0.8rem 0; line-height: 1.2;">${noticia.titulo}</h1>
              <p style="color: var(--text-muted); font-size: 0.9rem; margin-bottom: 1.5rem;">${noticia.data}</p>
              
              <img src="${noticia.imagem}" alt="${noticia.titulo}" style="width: 100%; border-radius: 8px; margin-bottom: 1.5rem;">
              
              <div style="font-size: 1.1rem; line-height: 1.8;">
                ${noticia.conteudo}
              </div>

              <div style="margin-top: 3rem; border-top: 1px solid var(--accent-border, #333); padding-top: 1.5rem;">
                <a href="index.html" style="color: var(--text-primary, #fff); font-weight: bold; text-decoration: none;">← Voltar para a página inicial</a>
              </div>
            `;
          } else {
            articleDetail.innerHTML = '<h2>Notícia não encontrada.</h2><br><a href="index.html">Voltar para a Home</a>';
          }
        })
        .catch(error => {
          console.error('Erro ao carregar a matéria:', error);
          articleDetail.innerHTML = '<p>Erro ao carregar a notícia.</p>';
        });
    });
  </script>
</body>
</html>
