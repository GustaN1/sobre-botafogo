name: Atualizar Notícias Automaticamente

on:
  schedule:
    # Roda a cada 2 horas (Formato Cron)
    - cron: '0 */2 * * *'
  workflow_dispatch: # Permite forçar atualização manual pelo GitHub Actions

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o código do repositório
        uses: actions/checkout@v3

      - name: Configurar ambiente Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Instalar dependências
        run: npm install rss-parser axios cheerio

      - name: Executar script de coleta de notícias
        run: node atualizar-noticias.js

      - name: Salvar e enviar alterações para o GitHub
        run: |
          git config --global user.name "Bot Automation"
          git config --global user.email "bot@github.com"
          git add data/noticias.json
          git diff-index --quiet HEAD || git commit -m "🤖 [BOT] Notícias atualizadas automaticamente"
          git push